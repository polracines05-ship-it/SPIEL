<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canned Message Generator - Relocation Cancellation</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg border border-gray-200 p-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-4 mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-800">Canned Message Generator</h1>
        <p class="text-sm text-gray-500">Cancel Internet Service Relocation Request</p>
      </div>
      <span class="text-xs bg-blue-100 text-blue-800 font-mono px-2.5 py-1 rounded-full font-semibold">
        Shortcut: !cancelreloc
      </span>
    </div>

    <!-- Dynamic Form Inputs -->
    <form id="cannedForm" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Recipient / Support Name</label>
        <input type="text" id="recipientName" value="Support Team" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Account Number</label>
        <input type="text" id="accountNumber" value="10982374" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Account Name</label>
        <input type="text" id="accountName" value="John Doe" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Your Name (Sender)</label>
        <input type="text" id="senderName" value="John Doe" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Contact Number</label>
        <input type="text" id="contactNumber" value="09170000000" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Current Service Address</label>
        <input type="text" id="currentAddress" value="Pasig City" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </form>

    <!-- Live Preview Box -->
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-6">
      <div class="mb-4">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Subject</span>
        <div id="subjectPreview" class="text-sm font-semibold text-gray-800 bg-white p-2 border rounded"></div>
      </div>
      <div>
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Body</span>
        <div id="bodyPreview" class="text-sm text-gray-700 whitespace-pre-line bg-white p-3 border rounded leading-relaxed"></div>
      </div>
    </div>

    <!-- Copy Action Button -->
    <button id="copyBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg transition duration-200 shadow">
      Copy Full Canned Response
    </button>

  </div>

  <!-- JavaScript Logic -->
  <script>
    // Templates with variable placeholders
    const template = {
      subject: "Update on Internet Service Relocation Request - Account No. {accountNumber}",
      body: `Hi {recipientName},

I am writing to formally request the cancellation of my existing internet service relocation request for Account No. {accountNumber} (under the name of {accountName}).

Please disregard the previous request to move the connection. I have decided to retain the service at my current address instead.

Kindly confirm once the relocation request has been officially canceled and removed from your active dispatch queue.

Thank you,

{senderName}
Contact Number: {contactNumber}
Service Address: {currentAddress}`
    };

    // DOM Elements
    const formInputs = document.querySelectorAll("#cannedForm input");
    const subjectPreview = document.getElementById("subjectPreview");
    const bodyPreview = document.getElementById("bodyPreview");
    const copyBtn = document.getElementById("copyBtn");

    // Function to replace placeholders dynamically
    function renderTemplate() {
      const values = {
        recipientName: document.getElementById("recipientName").value || "[Name/Support Team]",
        accountNumber: document.getElementById("accountNumber").value || "[Account Number]",
        accountName: document.getElementById("accountName").value || "[Account Name]",
        senderName: document.getElementById("senderName").value || "[Your Name]",
        contactNumber: document.getElementById("contactNumber").value || "[Your Contact Number]",
        currentAddress: document.getElementById("currentAddress").value || "[Your Current Address]"
      };

      let renderedSubject = template.subject;
      let renderedBody = template.body;

      Object.keys(values).forEach(key => {
        const regex = new RegExp(`\\{${key}\\}`, "g");
        renderedSubject = renderedSubject.replace(regex, values[key]);
        renderedBody = renderedBody.replace(regex, values[key]);
      });

      subjectPreview.textContent = renderedSubject;
      bodyPreview.textContent = renderedBody;
    }

    // Event listeners to update preview on typing
    formInputs.forEach(input => {
      input.addEventListener("input", renderTemplate);
    });

    // Copy to Clipboard functionality
    copyBtn.addEventListener("click", () => {
      const fullMessage = `Subject: ${subjectPreview.textContent}\n\n${bodyPreview.textContent}`;
      navigator.clipboard.writeText(fullMessage).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copied to Clipboard!";
        copyBtn.classList.remove("bg-blue-600", "hover:bg-blue-700");
        copyBtn.classList.add("bg-green-600");

        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.classList.remove("bg-green-600");
          copyBtn.classList.add("bg-blue-600", "hover:bg-blue-700");
        }, 2000);
      });
    });

    // Initial render
    renderTemplate();
  </script>

</body>
</html>
