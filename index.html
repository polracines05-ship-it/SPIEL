<!-- ================================================================= -->
<!-- FEATURE 1: INSTANT INFRACTION TRIAGE WIDGET (HOTKEY & QUICK-ACTION) -->
<!-- ================================================================= -->

<!-- HTML Component (Insert into Dashboard Panel or Sidebar) -->
<div id="triage-quick-bar" class="triage-bar">
  <div class="triage-header">
    <span class="triage-title">⚡ Instant Infraction Triage</span>
    <span class="triage-hint">Press 1-6 for instant response</span>
  </div>
  <div class="triage-grid">
    <button class="triage-btn" data-infraction="blurry-id" onclick="triggerTriage('blurry-id')">
      <span class="key">1</span> Blurry ID
    </button>
    <button class="triage-btn" data-infraction="name-mismatch" onclick="triggerTriage('name-mismatch')">
      <span class="key">2</span> Name Mismatch
    </button>
    <button class="triage-btn" data-infraction="phone-detected" onclick="triggerTriage('phone-detected')">
      <span class="key">3</span> Phone Detected
    </button>
    <button class="triage-btn" data-infraction="looking-away" onclick="triggerTriage('looking-away')">
      <span class="key">4</span> Looking Away
    </button>
    <button class="triage-btn" data-infraction="break-violation" onclick="triggerTriage('break-violation')">
      <span class="key">5</span> Break Violation
    </button>
    <button class="triage-btn" data-infraction="remote-desktop" onclick="triggerTriage('remote-desktop')">
      <span class="key">6</span> Remote Desktop
    </button>
  </div>
  <div id="triage-output-panel" class="triage-output hidden">
    <div class="triage-output-header">
      <span id="triage-action-title">Action Protocol</span>
      <button onclick="closeTriageOutput()">✕</button>
    </div>
    <div class="triage-content">
      <p><strong>Canned Message:</strong> <span id="triage-msg"></span></p>
      <p><strong>Policy Rule:</strong> <span id="triage-policy"></span></p>
      <button class="copy-btn" onclick="copyTriageMessage()">📋 Copy Message</button>
    </div>
  </div>
</div>

<!-- CSS Component (Insert into <style> section) -->
<style>
  .triage-bar {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    font-family: inherit;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .triage-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .triage-title {
    color: #38bdf8;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .triage-hint {
    color: #94a3b8;
    font-size: 11px;
  }
  .triage-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .triage-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .triage-btn:hover {
    background: #3b82f6;
    border-color: #60a5fa;
    transform: translateY(-1px);
  }
  .triage-btn .key {
    background: rgba(0, 0, 0, 0.4);
    color: #38bdf8;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
  }
  .triage-output {
    margin-top: 12px;
    background: #090d16;
    border: 1px solid #1e3a8a;
    border-radius: 8px;
    padding: 12px;
  }
  .triage-output.hidden { display: none; }
  .triage-output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #60a5fa;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 6px;
  }
  .triage-output-header button {
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 14px;
  }
  .triage-content p {
    color: #cbd5e1;
    font-size: 12px;
    margin: 6px 0;
  }
  .copy-btn {
    margin-top: 8px;
    background: #2563eb;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }
  .copy-btn:hover { background: #1d4ed8; }
</style>

<!-- JavaScript Component (Insert into <script> section) -->
<script>
  const triageData = {
    'blurry-id': {
      title: 'Blurry ID Protocol',
      message: 'Please hold your valid government-issued photo ID closer to the webcam and ensure the camera lens is clean so your details are fully legible.',
      policy: 'Infractions Matrix -> Section 3.1: Unclear Identification (Level 1)'
    },
    'name-mismatch': {
      title: 'Name Mismatch Protocol',
      message: 'The name on your submitted identification does not match the registration profile. Please provide secondary identification or confirmation of legal name change.',
      policy: 'Infractions Matrix -> Section 3.2: Identity Discrepancy (Level 2)'
    },
    'phone-detected': {
      title: 'Phone Detected Protocol',
      message: 'Warning: A mobile device or electronic communication tool was detected within your workspace view. Please store it completely out of reach immediately.',
      policy: 'Infractions Matrix -> Section 4.1: Prohibited Electronic Device (Level 3)'
    },
    'looking-away': {
      title: 'Looking Away Protocol',
      message: 'Please maintain your focus toward the testing screen. Looking away from the monitor for extended periods violates active session monitoring guidelines.',
      policy: 'Infractions Matrix -> Section 2.4: Gaze Deviation Warning (Level 1)'
    },
    'break-violation': {
      title: 'Break Violation Protocol',
      message: 'Unscheduled breaks are not permitted during active examination blocks. Please return your focus to the screen or request formal approval.',
      policy: 'Infractions Matrix -> Section 5.0: Unauthorized Departure (Level 2)'
    },
    'remote-desktop': {
      title: 'Remote Desktop Protocol',
      message: 'Active remote desktop control software or screen-sharing utilities have been identified on your machine. You must close them immediately to proceed.',
      policy: 'Infractions Matrix -> Section 6.2: Virtual Machine / Remote Software (Level 4)'
    }
  };

  function triggerTriage(key) {
    const data = triageData[key];
    if (!data) return;
    document.getElementById('triage-action-title').textContent = data.title;
    document.getElementById('triage-msg').textContent = data.message;
    document.getElementById('triage-policy').textContent = data.policy;
    document.getElementById('triage-output-panel').classList.remove('hidden');
  }

  function closeTriageOutput() {
    document.getElementById('triage-output-panel').classList.add('hidden');
  }

  function copyTriageMessage() {
    const text = document.getElementById('triage-msg').textContent;
    navigator.clipboard.writeText(text).then(() => {
      if (typeof showToast === 'function') {
        showToast('Canned response copied to clipboard!');
      } else {
        alert('Copied to clipboard!');
      }
    });
  }

  document.addEventListener('keydown', (e) => {
    if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;
    if (e.key >= '1' && e.key <= '6') {
      const keys = ['blurry-id', 'name-mismatch', 'phone-detected', 'looking-away', 'break-violation', 'remote-desktop'];
      triggerTriage(keys[parseInt(e.key) - 1]);
    }
  });
</script>
