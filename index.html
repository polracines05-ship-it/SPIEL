<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiveActs Proctor Dojo — Kyoto Samurai Estate (PST)</title>
<style>
  :root {
    /* Ghost of Tsushima & Edo Kyoto Samurai Palette */
    --clan-red: #B22222;
    --clan-red-bright: #D92b2b;
    --imperial-gold: #F4C542;
    --imperial-gold-glow: rgba(244, 197, 66, 0.45);
    --edo-black: #121212;
    --edo-dark: #1A1410;
    --rice-paper: #F8EFD5;
    --rice-paper-dim: #D9CDA0;
    --cedar-brown: #6B4423;
    --lantern-orange: #D97706;

    --panel-bg: rgba(26, 20, 16, 0.92);
    --card-bg: rgba(36, 28, 22, 0.88);
    --border-line: rgba(244, 197, 66, 0.35);
    --border-soft: rgba(248, 239, 213, 0.12);

    --text-main: #F8EFD5;
    --text-dim: #C7BFA3;
    --text-muted: #827763;

    --font-head: Georgia, "Iowan Old Style", "Palatino Linotype", "Hiragino Mincho ProN", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--text-main);
    background-color: var(--edo-black);
    display: flex;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ============================================================
     DYNAMIC 20-SECOND DAY-NIGHT SKY ENGINE
     ============================================================ */
  .scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  
  .scene-sky {
    position: absolute; inset: 0;
    animation: celestialCycle 20s ease-in-out infinite;
  }

  @keyframes celestialCycle {
    0%, 100% { background: linear-gradient(180deg, #1d0f28 0%, #4a2143 35%, #8c3b54 70%, #d96b43 100%); }
    16.6%    { background: linear-gradient(180deg, #103c61 0%, #1e6992 35%, #4ea3c8 70%, #9be1eb 100%); }
    33.3%    { background: linear-gradient(180deg, #092c48 0%, #114b73 35%, #2a87b3 70%, #76d0f0 100%); }
    50%      { background: linear-gradient(180deg, #160a24 0%, #451034 35%, #822234 70%, #df5720 100%); }
    66.6%    { background: linear-gradient(180deg, #040914 0%, #081526 35%, #0b2238 70%, #0a1829 100%); }
    83.3%    { background: linear-gradient(180deg, #010308 0%, #030712 35%, #050d1f 70%, #020610 100%); }
  }

  /* Heavenly Sun & Moon Sync */
  .sun-glow {
    position: absolute; top: 2%; right: 12%; width: 420px; height: 420px; border-radius: 50%;
    animation: sunGlowCycle 20s ease-in-out infinite;
    filter: blur(30px);
  }

  @keyframes sunGlowCycle {
    0%, 100% { background: radial-gradient(circle, rgba(255, 140, 0, 0.4) 0%, rgba(217, 107, 67, 0.2) 50%, transparent 75%); }
    16.6%    { background: radial-gradient(circle, rgba(255, 230, 100, 0.5) 0%, rgba(155, 225, 235, 0.2) 50%, transparent 75%); }
    33.3%    { background: radial-gradient(circle, rgba(255, 255, 180, 0.6) 0%, rgba(118, 208, 240, 0.2) 50%, transparent 75%); }
    50%      { background: radial-gradient(circle, rgba(223, 87, 32, 0.6) 0%, rgba(130, 34, 52, 0.25) 50%, transparent 75%); }
    66.6%    { background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(11, 34, 56, 0.15) 50%, transparent 75%); }
    83.3%    { background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(5, 13, 31, 0.08) 50%, transparent 75%); }
  }

  .sun-rays {
    position: absolute; top: 0; right: 10%; width: 70%; height: 100%;
    background: linear-gradient(135deg, transparent 35%, rgba(255, 208, 0, 0.05) 48%, rgba(255, 255, 255, 0.03) 52%, transparent 65%);
    transform: rotate(-12deg);
  }

  .sky-clouds {
    position: absolute; inset: 0;
    background: 
      radial-gradient(ellipse 65% 22% at 20% 18%, rgba(252, 247, 232, 0.1), transparent 70%),
      radial-gradient(ellipse 85% 32% at 75% 28%, rgba(252, 247, 232, 0.06), transparent 75%);
    animation: floatClouds 55s ease-in-out infinite alternate;
  }
  @keyframes floatClouds {
    0% { transform: translateX(-40px) scale(1); }
    100% { transform: translateX(40px) scale(1.05); }
  }

  /* Distant Mountain Ranges */
  .scene-mountains { position: absolute; left: 0; right: 0; bottom: 10%; height: 52%; opacity: 0.92; }
  .scene-mountains svg { width: 100%; height: 100%; display: block; }

  /* Floating Kami's Lookout */
  .lookout-floating {
    position: absolute; right: 12%; top: 8%; width: 260px; height: 180px; opacity: 0.85;
    filter: drop-shadow(0 0 15px rgba(255, 208, 0, 0.25));
    animation: lookoutDrift 16s ease-in-out infinite alternate;
  }
  @keyframes lookoutDrift { 0% { transform: translateY(0); } 100% { transform: translateY(-14px); } }

  /* Guardian Shenron in Clouds */
  .shenron-clouds {
    position: absolute; left: 15%; top: 6%; width: 620px; height: 320px; opacity: 0.45;
    filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.25));
    animation: shenronGlide 30s ease-in-out infinite alternate;
  }
  @keyframes shenronGlide { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-20px) scale(1.04); } }

  /* Flying Nimbus & Goku */
  .nimbus-goku {
    position: absolute; left: -160px; top: 22%; width: 150px; height: 75px; opacity: 0.9;
    filter: drop-shadow(0 0 12px rgba(255, 208, 0, 0.6));
    animation: nimbusSailing 38s linear infinite;
  }
  @keyframes nimbusSailing {
    0% { transform: translateX(0) translateY(0); opacity: 0; }
    5% { opacity: 0.95; }
    90% { opacity: 0.95; }
    100% { transform: translateX(calc(100vw + 350px)) translateY(-60px); opacity: 0; }
  }

  /* EXPANDED KYOTO MACHIYA HOUSES & LANTERN POSTS (FOREGROUND) */
  .kyoto-streetscape {
    position: absolute; left: 0; right: 0; bottom: 0; height: 320px; opacity: 0.96;
    filter: drop-shadow(0 0 25px rgba(0,0,0,0.9));
  }
  .kyoto-streetscape svg { width: 100%; height: 100%; display: block; }

  .swaying-pines {
    transform-origin: bottom center;
    animation: pineWind 6s ease-in-out infinite alternate;
  }
  @keyframes pineWind { 0% { transform: rotate(0deg); } 100% { transform: rotate(2.8deg); } }

  .scene-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 220px 60px rgba(3, 8, 14, 0.75); }
  #fxCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  /* ============================================================
     SIDEBAR & NAVIGATION
     ============================================================ */
  .sidebar {
    position: relative; z-index: 10;
    width: 310px; flex-shrink: 0; height: 100vh; position: sticky; top: 0; overflow-y: auto;
    background: linear-gradient(180deg, rgba(13, 27, 24, 0.95), rgba(6, 14, 20, 0.98));
    border-right: 1px solid var(--border-line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: flex; flex-direction: column; padding: 0;
    box-shadow: 12px 0 35px rgba(0, 0, 0, 0.7);
  }
  .sidebar::before {
    content: ""; display: block; height: 4px; width: 100%; flex-shrink: 0;
    background: linear-gradient(90deg, transparent, var(--imperial-gold), var(--clan-red), transparent);
  }

  .sidebar-header { padding: 22px 14px 18px; text-align: center; border-bottom: 1px solid var(--border-line); }

  .brand-mon {
    width: 58px; height: 58px; margin: 0 auto 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--imperial-gold), var(--clan-red) 70%, #4a0c0c 100%);
    border: 2px solid var(--imperial-gold);
    box-shadow: 0 0 15px rgba(244, 197, 66, 0.4), inset 0 -2px 6px rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem; font-weight: 900; color: #121212; font-family: var(--font-head);
  }

  .sidebar-header h1 {
    font-family: var(--font-head); font-size: 1.25rem; letter-spacing: 0.08em; color: var(--text-main);
    text-transform: uppercase;
  }
  .sidebar-header .subtitle { font-size: 0.7rem; color: var(--imperial-gold); margin-top: 4px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; }

  .view-selectors { padding: 14px 12px; border-bottom: 1px solid var(--border-line); }
  .view-btn {
    width: 100%; display: flex; align-items: center; gap: 12px; background: rgba(252, 247, 232, 0.03); border: 1px solid rgba(244, 197, 66, 0.2);
    color: var(--rice-paper-dim); text-align: left; padding: 11px 14px; font-size: 0.86rem; font-weight: 600;
    border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: all 0.2s ease;
    font-family: var(--font-body); position: relative; overflow: hidden;
  }
  .view-btn .vi { font-size: 1.1rem; width: 1.4em; text-align: center; color: var(--imperial-gold); }
  .view-btn:hover {
    background: rgba(244, 197, 66, 0.12); color: var(--text-main); border-color: var(--imperial-gold);
    transform: translateX(4px);
  }
  .view-btn.active {
    background: linear-gradient(90deg, rgba(244, 197, 66, 0.25), rgba(178, 34, 34, 0.15));
    color: var(--imperial-gold); border-color: var(--imperial-gold);
  }
  .view-btn.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--imperial-gold);
  }

  .nav-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); margin: 16px 16px 8px; font-weight: 800; }
  .nav-links { list-style: none; padding: 0 10px; overflow-y: auto; flex-grow: 1; }
  .nav-links li { margin-bottom: 3px; }
  .nav-links button {
    width: 100%; text-align: left; background: none; border: 1px solid transparent; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 8px 10px; color: var(--text-dim); border-radius: 6px; font-size: 0.8rem; font-weight: 600;
    transition: all 0.18s ease; font-family: var(--font-body);
  }
  .nav-links button:hover {
    background: rgba(244, 197, 66, 0.12); color: var(--imperial-gold); border-color: rgba(244, 197, 66, 0.3);
    padding-left: 14px;
  }
  .nav-links .cnt { color: var(--imperial-gold); font-size: 0.72rem; background: rgba(0,0,0,0.5); padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border-line); font-weight: 700; }

  .sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border-line); font-size: 0.68rem; color: var(--text-muted); text-align: center; letter-spacing: 0.08em; font-weight: 700; }

  /* ============================================================
     MAIN CONTENT & HEADER CONTAINER
     ============================================================ */
  .main-content { position: relative; z-index: 10; flex-grow: 1; padding: 22px 38px 60px; min-width: 0; }

  /* HEADER CONTAINER WITH CENTERED LOGO AND TOP TIME/DATE */
  .header-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(18, 14, 12, 0.85);
    border: 1px solid var(--border-line);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 22px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  /* Top Bar Layout */
  .header-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--imperial-gold);
    font-size: 0.9rem;
  }

  .time-main {
    font-family: var(--font-head);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .date-display {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 600;
  }

  /* Centered Logo Section */
  .header-logo-section {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 6px 0;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-head);
    font-weight: 900;
    font-size: 2.2rem;
    letter-spacing: 0.06em;
  }

  .badge-five {
    background-color: #00c853;
    color: #ffffff;
    padding: 2px 14px;
    border-radius: 6px;
    transform: skewX(-10deg);
    display: inline-block;
    box-shadow: 0 2px 10px rgba(0, 200, 83, 0.4);
  }

  .badge-acts {
    color: #ffffff;
    text-transform: uppercase;
  }

  /* Flash News Ticker Integration */
  .flash-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(26, 20, 16, 0.95);
    border: 1px solid var(--clan-red);
    border-left: 4px solid var(--clan-red-bright);
    border-radius: 8px;
    padding: 6px 12px;
    box-shadow: 0 4px 15px rgba(178, 34, 34, 0.35);
    overflow: hidden;
  }

  .flash-tag {
    background: linear-gradient(135deg, var(--clan-red-bright), var(--clan-red));
    color: #ffffff;
    font-family: var(--font-head);
    font-size: 0.72rem;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(217, 43, 43, 0.5);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .flash-text {
    margin: 0;
    font-size: 0.88rem;
    color: var(--rice-paper);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dashboard-view { display: none; }
  .dashboard-view.active { display: block; }

  .page-title { font-family: var(--font-head); font-size: 1.8rem; color: var(--text-main); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .page-sub { font-size: 0.88rem; color: var(--text-dim); margin-bottom: 24px; font-weight: 500; }

  /* ================= ORGANIZATIONAL CHART ================= */
  .org-chart-container {
    background: var(--panel-bg);
    border: 1px solid var(--border-line);
    border-radius: 12px;
    padding: 28px 20px;
    margin-bottom: 28px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
  }
  .org-tree {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    overflow-x: auto;
    padding: 10px 0;
  }

  .org-node {
    background: var(--card-bg);
    border: 1px solid var(--border-line);
    border-left: 4px solid var(--imperial-gold);
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    transition: all 0.2s ease;
  }
  .org-node:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(244, 197, 66, 0.25);
    border-color: var(--imperial-gold);
  }
  .org-node.root {
    border-left-color: var(--clan-red);
    background: linear-gradient(135deg, rgba(36, 28, 22, 0.95), rgba(178, 34, 34, 0.3));
    min-width: 260px;
  }
  .org-node.sub-root {
    border-left-color: var(--lantern-orange);
    background: linear-gradient(135deg, rgba(36, 28, 22, 0.95), rgba(217, 119, 6, 0.2));
    min-width: 240px;
  }

  .org-title {
    font-family: var(--font-head);
    font-size: 0.78rem;
    color: var(--imperial-gold);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .org-name {
    font-size: 0.92rem;
    color: var(--text-main);
    font-weight: 700;
  }

  .org-badge {
    background: rgba(244, 197, 66, 0.18);
    border: 1px solid var(--border-line);
    color: var(--imperial-gold);
    font-size: 0.68rem;
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 800;
  }

  .org-line-v {
    width: 2px;
    height: 22px;
    background: var(--border-line);
  }

  .org-teams-branch {
    display: flex;
    justify-content: center;
    gap: 20px;
    width: 100%;
    position: relative;
    padding-top: 20px;
  }
  .org-teams-branch::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 2px;
    background: var(--border-line);
  }

  .org-team-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .org-team-column::before {
    content: "";
    position: absolute;
    top: -20px;
    width: 2px;
    height: 20px;
    background: var(--border-line);
  }

  .org-card-group {
    background: rgba(18, 14, 12, 0.75);
    border: 1px solid var(--border-line);
    border-radius: 10px;
    padding: 14px;
    width: 100%;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
  }
  .org-group-header {
    font-family: var(--font-head);
    font-size: 0.8rem;
    color: var(--imperial-gold);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border-line);
    padding-bottom: 8px;
    margin-bottom: 12px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .org-member-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .org-member-list.grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }
  .org-member-item {
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--imperial-gold);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.84rem;
    color: var(--text-main);
    font-weight: 600;
    text-align: left;
    transition: all 0.2s ease;
  }
  .org-member-item:hover {
    background: rgba(36, 28, 22, 0.95);
    border-left-color: var(--clan-red);
    transform: translateX(3px);
  }

  .section-container { margin-bottom: 30px; scroll-margin-top: 90px; }
  .section-title {
    font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; color: var(--text-main);
    border-bottom: 1px solid var(--border-line); padding-bottom: 10px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; letter-spacing: 0.03em;
  }
  .section-count { font-size: 0.75rem; font-weight: 800; color: var(--imperial-gold); background: rgba(244, 197, 66, 0.15); border: 1px solid var(--border-line); padding: 2px 10px; border-radius: 12px; font-family: var(--font-body); }
  .empty-state { color: var(--text-dim); font-size: 0.88rem; padding: 28px 20px; text-align: center; border: 1px dashed var(--border-line); border-radius: 10px; background: rgba(26, 20, 16, 0.6); backdrop-filter: blur(8px); }

  /* CARDS & SCROLLS */
  .card {
    position: relative; background: var(--card-bg);
    border: 1px solid var(--border-line); border-left: 4px solid var(--clan-red); border-radius: 6px 12px 12px 6px;
    padding: 16px 18px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    transition: all 0.22s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.6);
  }
  .card:hover, .card.highlighted {
    background: rgba(36, 28, 22, 0.95); border-left-color: var(--imperial-gold); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(244, 197, 66, 0.25);
  }
  .card.is-pinned { border-left-color: var(--lantern-orange); }
  .card-body { flex-grow: 1; min-width: 0; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-tag { display: inline-block; font-size: 0.62rem; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-main); letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.12); }
  .card-tag.win { background: rgba(0, 210, 255, 0.25); color: #99ebff; border-color: rgba(0, 210, 255, 0.4); }
  .card-tag.mac { background: rgba(153, 51, 255, 0.25); color: #e0b3ff; border-color: rgba(153, 51, 255, 0.4); }
  .card-tag.linux { background: rgba(42, 90, 59, 0.4); color: #b3ffcc; border-color: rgba(42, 90, 59, 0.6); }
  .card-tag.critical { background: rgba(178, 34, 34, 0.4); color: #ff99aa; border-color: rgba(178, 34, 34, 0.6); }
  .card-tag.hashi { background: rgba(217, 119, 6, 0.3); color: var(--imperial-gold); border-color: rgba(217, 119, 6, 0.5); }

  .message-text { font-size: 0.94rem; line-height: 1.65; white-space: pre-line; color: #F8EFD5; font-family: var(--font-body); font-weight: 500; }

  .card-actions { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; align-items: stretch; }
  .icon-btn {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border-line); color: var(--text-dim);
    border-radius: 6px; padding: 6px 10px; font-size: 0.88rem; cursor: pointer; line-height: 1; transition: all 0.2s ease;
  }
  .icon-btn:hover { background: rgba(244, 197, 66, 0.2); color: var(--imperial-gold); border-color: var(--imperial-gold); }
  .icon-btn.on { color: var(--imperial-gold); border-color: var(--lantern-orange); background: rgba(217, 119, 6, 0.25); }
  .icon-row { display: flex; gap: 6px; }

  /* IMPERIAL GOLD SEAL BUTTONS */
  .seal-btn {
    background: linear-gradient(135deg, var(--imperial-gold) 0%, var(--clan-red) 100%);
